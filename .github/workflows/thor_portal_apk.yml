name: Build Thor portal APK

# Builds a sideloadable APK of this branch and attaches it to the run as an artifact
# ("cemu-portal-apk" on the run's summary page).

on:
  workflow_dispatch:
  push:
    branches:
      - thor-skylanders-portal
    paths-ignore:
      - "*.md"

concurrency:
  group: thor-portal-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  NDK_VERSION: "29.0.14206865"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext ninja-build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-36"

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'cmake/vcpkg_android.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-android-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**', 'cmake/vcpkg_android.cmake') }}-
            vcpkg-android-

      # Every build is signed with the same debug key so a new APK installs over the previous one.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cemu-portal-debug-keystore

      - name: Create debug signing key
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-cache
          bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cemu-portal-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
